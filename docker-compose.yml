version: "3.9"

services:
  app:
    build: .
    container_name: node_app
    ports:
      - "3055:3055"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: database_development
    # Add this volume so local code changes reflect in the container
    volumes:
      - .:/usr/src/app
    # Optional: use nodemon to auto-reload on code changes
    command: npm install && npx nodemon server.js

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: database_development
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: